<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KinoTV</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111827;--muted:#98a4b7;--accent:#e6b84a;--focus:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f6fa;font:20px Arial,sans-serif;overflow-x:hidden}
header{height:82px;display:flex;align-items:center;padding:0 5vw;gap:42px;background:linear-gradient(180deg,#05070cf5,#080b12dd);position:sticky;top:0;z-index:5}
.logo{font-size:30px;font-weight:900;letter-spacing:2px;color:var(--accent)}nav{display:flex;gap:14px}button,.nav{border:0;color:#d8deea;background:transparent;padding:12px 18px;border-radius:9px;font-size:18px;cursor:pointer}
button:focus,.nav:focus,.card:focus{outline:3px solid var(--accent);outline-offset:3px;background:#263044;color:white;transform:scale(1.04)}
main{padding:24px 5vw 70px}.hero{min-height:310px;border-radius:18px;background:linear-gradient(90deg,#101827 5%,#101827d9 45%,#10182722),linear-gradient(0deg,#080b12,#24334a);display:flex;align-items:end;padding:38px;margin-bottom:34px;position:relative;overflow:hidden}
.hero h1{font-size:42px;margin:0 0 10px}.hero p{color:#c1c9d6;max-width:650px}.section{margin:28px 0}.section h2{font-size:25px;margin:0 0 16px}.cards{display:flex;gap:18px;overflow-x:auto;padding:5px 5px 18px;scrollbar-width:none}.card{flex:0 0 158px;min-height:248px;border-radius:12px;background:#182235;overflow:hidden;cursor:pointer;position:relative;transition:.15s}
.card img{width:100%;height:205px;object-fit:cover;background:#202c40}.card .name{padding:10px 11px;font-size:15px;line-height:1.25}.tag{color:var(--accent);font-size:13px;padding:8px 11px 0}
.status{color:var(--muted);font-size:17px;padding:22px 0}.detail{display:flex;gap:34px;padding:35px 2vw;min-height:65vh}.detail img{width:260px;max-height:390px;object-fit:cover;border-radius:12px}.detailText{max-width:800px}.detail h1{font-size:38px}.detail p{color:#c1c9d6;line-height:1.5}.actions{display:flex;gap:12px;margin-top:25px}.primary{background:var(--accent);color:#111;font-weight:bold}.player{height:70vh;background:#000}.player iframe,.player video{width:100%;height:100%;border:0}.toolbar{display:flex;gap:12px;align-items:center}.search{background:#172235;border:1px solid #35435b;color:white;padding:12px 16px;border-radius:9px;font-size:18px;width:270px}
@media(max-width:900px){header{gap:12px;padding:0 20px}.hero{min-height:220px}main{padding:18px}.card{flex-basis:130px}.card img{height:175px}}
</style></head>
<body><header><div class="logo">KINO<span style="color:#fff">TV</span></div><nav><button class="nav" onclick="loadHome()">Home</button><button class="nav" onclick="loadCategory('movie')">Movies</button><button class="nav" onclick="loadCategory('series')">Series</button><button class="nav" onclick="showSearch()">Search</button></nav><div style="margin-left:auto" class="toolbar"><input id="search" class="search" placeholder="Search titles" onkeydown="if(event.key==='Enter')searchTitles(this.value)"></div></header>
<main id="app"><div class="status">Loading KinoTV…</div></main>
<script>
const BASE='https://1.kinogoline.net/';
let page='home',history=[],items=[],lastHtml='';
const app=document.getElementById('app');
function absolute(u){try{return new URL(u,BASE).href}catch(e){return ''}}
function safe(u){return /^https:\/\//.test(u)&&(new URL(u).hostname==='kinogoline.net'||new URL(u).hostname.endsWith('.kinogoline.net'))}
function doc(html){return new DOMParser().parseFromString(html,'text/html')}
function titleOf(a){return (a.innerText||a.textContent||a.getAttribute('title')||'').trim().replace(/\s+/g,' ')}
function extract(html){const d=doc(html),seen=new Set(),out=[];d.querySelectorAll('a[href]').forEach(a=>{const href=absolute(a.getAttribute('href'));if(!safe(href)||href===BASE||seen.has(href))return;const img=a.querySelector('img');const name=titleOf(a)||img?.alt||img?.title||'';const poster=img?.getAttribute('data-src')||img?.getAttribute('data-original')||img?.src||'';if(!name&&!poster)return;seen.add(href);out.push({name:name||'Open title',href,poster:absolute(poster),desc:a.getAttribute('title')||''})});return out}
function card(x){return '<div class="card" tabindex="0" role="button" onclick="openTitle('+JSON.stringify(x.href).replace(/</g,'\\u003c')+')"><img loading="lazy" src="'+(x.poster||'')+'" onerror="this.style.opacity=.15"><div class="name">'+esc(x.name)+'</div></div>'}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderRows(list,heading){if(!list.length)return '<div class="status">No titles were detected on this page. The website may use a different catalogue layout or require access from your network.</div>';let rows='';for(let i=0;i<list.length;i+=12){rows+='<section class="section"><h2>'+esc(i===0?heading:'More to explore')+'</h2><div class="cards">'+list.slice(i,i+12).map(card).join('')+'</div></section>'}return rows}
async function loadHome(){page='home';app.innerHTML='<div class="status">Connecting to KinoGoline…</div>';try{const r=await fetch(BASE,{credentials:'include'});if(!r.ok)throw Error('Website returned HTTP '+r.status);lastHtml=await r.text();items=extract(lastHtml);app.innerHTML='<section class="hero"><div><div class="tag">YOUR TV MOVIE HUB</div><h1>Discover something great</h1><p>Movies and series, arranged for the big screen.</p><button class="primary" onclick="loadCategory(\'movie\')">Explore titles</button></div></section>'+renderRows(items,'Popular on KinoTV') }catch(e){app.innerHTML='<section class="hero"><div><div class="tag">KINO TV</div><h1>Welcome to KinoTV</h1><p>We could not read the catalogue automatically. Check the website connection, then try again.</p><button class="primary" onclick="loadHome()">Retry</button> <button onclick="openSite()">Open website</button></div></section><div class="status">'+esc(e.message)+'</div>'}focusFirst()}
async function openSite(){if(window.KinoTV)KinoTV.openExternal(BASE)}
async function loadCategory(kind){loadHome(); }
async function openTitle(url){if(!safe(url))return;history.push({page,html:app.innerHTML});page='detail';app.innerHTML='<div class="status">Loading title…</div>';try{const r=await fetch(url,{credentials:'include'});if(!r.ok)throw Error('HTTP '+r.status);const html=await r.text(),d=doc(html),h=d.querySelector('h1')?.textContent||d.title||'Title details';const img=d.querySelector('meta[property="og:image"]')?.content||d.querySelector('img')?.src||'';const desc=d.querySelector('meta[name="description"]')?.content||d.querySelector('.description,.desc,.summary')?.textContent||'';const embeds=[...d.querySelectorAll('iframe[src],video source[src],video[src]')].map(x=>absolute(x.src||x.getAttribute('src'))).filter(Boolean);app.innerHTML='<div class="detail"><img src="'+esc(absolute(img))+'"><div class="detailText"><div class="tag">KINO TV • DETAILS</div><h1>'+esc(h.trim())+'</h1><p>'+esc(desc.trim().slice(0,900))+'</p><div class="actions">'+(embeds.length?'<button class="primary" onclick="play('+JSON.stringify(embeds[0])+')">▶ Play</button>':'<button onclick="playPage('+JSON.stringify(url)+')">Open watch page</button>')+'<button onclick="goBack()">Back</button></div></div></div>'}catch(e){app.innerHTML='<div class="status">Could not load details: '+esc(e.message)+' <button onclick="goBack()">Back</button></div>'}focusFirst()}
function play(url){if(!safe(url)&&!/^https:\/\//.test(url))return;history.push({page,html:app.innerHTML});page='player';app.innerHTML='<div class="actions"><button onclick="goBack()">← Back to details</button></div><div class="player"><iframe src="'+esc(url)+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>'}
function playPage(url){if(window.KinoTV)KinoTV.openExternal(url)}
function goBack(){const prev=history.pop();if(prev){page=prev.page;app.innerHTML=prev.html;focusFirst()}else loadHome()}
function showSearch(){document.getElementById('search').focus()}
function searchTitles(q){const found=items.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));app.innerHTML='<section class="section"><h2>Search results</h2><div class="cards">'+found.map(card).join('')+'</div></section>';focusFirst()}
function focusFirst(){setTimeout(()=>{const el=app.querySelector('button,.card');if(el)el.focus()},50)}
function tvKey(k){const map={19:'ArrowUp',20:'ArrowDown',21:'ArrowLeft',22:'ArrowRight',23:'Enter',66:'Enter'};const key=map[k];if(!key)return;const active=document.activeElement;let candidates=[...document.querySelectorAll('button,.card,input')].filter(x=>x.offsetParent!==null);if(key==='Enter'){active?.click?.();return}if(!candidates.includes(active)){candidates[0]?.focus();return}let i=candidates.indexOf(active),next=i;if(key==='ArrowRight')next=Math.min(i+1,candidates.length-1);if(key==='ArrowLeft')next=Math.max(0,i-1);if(key==='ArrowDown')next=Math.min(i+Math.max(1,Math.floor(innerWidth/190)),candidates.length-1);if(key==='ArrowUp')next=Math.max(0,i-Math.max(1,Math.floor(innerWidth/190)));candidates[next]?.focus()}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){const a=document.activeElement;if(a?.tagName==='INPUT')return;e.preventDefault();const k={ArrowUp:19,ArrowDown:20,ArrowLeft:21,ArrowRight:22}[e.key];tvKey(k)}});
loadHome();
</script></body></html>
